name: Complexity cross-platform qualification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/complexity-cross-platform/**'
      - 'tools/*complexity*'
      - 'pyproject.toml'
      - 'requirements/ci-bootstrap.txt'
      - '.github/workflows/complexity-cross-platform-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install pinned CI pip
        run: python -m pip install --disable-pip-version-check --require-hashes --upgrade -r requirements/ci-bootstrap.txt
      - run: python -m pip wheel . --no-deps --wheel-dir candidate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complexity-candidate
          path: candidate/*.whl
          if-no-files-found: error

  qualify:
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: complexity-candidate
          path: candidate
      - shell: bash
        run: TDE_WHEEL="$(find candidate -name '*.whl' -print -quit)" python tools/run_complexity_qualification.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complexity-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: qualification/
          if-no-files-found: error

  compare:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: complexity-qualification-*
          path: qualification-artifacts
          merge-multiple: true
      - run: mkdir -p qualification && cp qualification-artifacts/*.json qualification/ && python tools/compare_complexity_qualification.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complexity-cross-platform-summary
          path: qualification/cross-platform-summary.json
