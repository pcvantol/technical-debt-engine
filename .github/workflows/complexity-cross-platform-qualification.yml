name: Complexity cross-platform qualification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fixtures/complexity-cross-platform/**'
      - 'tools/*complexity*'
      - 'pyproject.toml'
      - '.github/workflows/complexity-cross-platform-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip wheel . --no-deps --wheel-dir candidate
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: complexity-candidate
          path: candidate/*.whl
          if-no-files-found: error

  qualify:
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: complexity-candidate
          path: candidate
      - shell: bash
        run: TDE_WHEEL="$(find candidate -name '*.whl' -print -quit)" python tools/run_complexity_qualification.py
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: complexity-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: qualification/
          if-no-files-found: error

  compare:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: complexity-qualification-*
          path: qualification-artifacts
          merge-multiple: true
      - run: cp qualification-artifacts/*.json qualification/ && python tools/compare_complexity_qualification.py
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: complexity-cross-platform-summary
          path: qualification/cross-platform-summary.json
