name: Docker release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable SHA already reachable from main
        required: true
        type: string
      candidate_version:
        description: Canonical release version
        required: true
        type: string
      release_profile:
        description: Intended non-publishing release profile
        required: true
        default: internal
        type: choice
        options: [internal]

permissions:
  contents: read

jobs:
  build-oci-candidate:
    runs-on: ubuntu-24.04
    env:
      TDE_CANDIDATE_SOURCE_BRANCH: main
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - id: candidate
        name: Verify exact mainline candidate snapshot
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          PYTHONPATH=src python tools/verify_release_candidate.py --candidate-sha "${{ inputs.candidate_sha }}" --version "${{ inputs.candidate_version }}" --profile "${{ inputs.release_profile }}" --main-ref origin/main | tee "$RUNNER_TEMP/candidate-snapshot.json"
          echo "sha=${{ inputs.candidate_sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install pinned CI pip
        run: python -m pip install --disable-pip-version-check --require-hashes --upgrade -r requirements/ci-bootstrap.txt
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install deterministic build tools
        run: |
          python -m pip install --require-hashes -r requirements/build-tools.txt
          python -m pip install radon==6.0.1
          curl --fail --location --silent --show-error https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl --output /usr/local/bin/cloc
          echo 'bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  /usr/local/bin/cloc' | sha256sum --check
          chmod +x /usr/local/bin/cloc
      - name: Run Docker artifact tests
        run: PYTHONPATH=src python -m unittest tests.test_docker_artifact -v
      - name: Build package candidate
        run: |
          python tools/package_build.py --output "$RUNNER_TEMP/package-one"
          python tools/package_build.py --output "$RUNNER_TEMP/package-two"
          cmp "$RUNNER_TEMP/package-one/SHA256SUMS" "$RUNNER_TEMP/package-two/SHA256SUMS"
      - name: Build non-published OCI archive
        run: python tools/build_docker_candidate.py --wheel "$RUNNER_TEMP"/package-one/*.whl --sdist "$RUNNER_TEMP"/package-one/*.tar.gz --output "$RUNNER_TEMP/oci"
      - name: Qualify and certify the complete candidate without publication
        run: |
          set -o pipefail
          PYTHONPATH=src python -c 'from tde_cli.main import main; raise SystemExit(main())' --format json release-qualify . --release-capability code-size --release-capability complexity --artifact-directory "$RUNNER_TEMP/package-one" --artifact-directory "$RUNNER_TEMP/package-two" --docker-artifact-directory "$RUNNER_TEMP/oci" --manifest-output "$RUNNER_TEMP/release-manifest.json" | tee "$RUNNER_TEMP/release-qualification.json"
          PYTHONPATH=src python -c 'from tde_cli.main import main; raise SystemExit(main())' --format json certify . --qualification-evidence "$RUNNER_TEMP/release-qualification.json" --report-output "$RUNNER_TEMP/release-certification.json" | tee "$RUNNER_TEMP/certify-output.json"
      - name: Assemble checksum-bound certified bundle
        run: |
          PYTHONPATH=src python tools/assemble_release_bundle.py --candidate-sha "$(git rev-parse HEAD)" --release-version "${{ inputs.candidate_version }}" --output "$RUNNER_TEMP/bundle" --wheel "$RUNNER_TEMP"/package-one/*.whl --sdist "$RUNNER_TEMP"/package-one/*.tar.gz --oci-archive "$RUNNER_TEMP/oci/tde-oci.tar" --docker-provenance "$RUNNER_TEMP/oci/docker-provenance.json" --release-manifest "$RUNNER_TEMP/release-manifest.json" --release-qualification "$RUNNER_TEMP/release-qualification.json" --release-certification "$RUNNER_TEMP/release-certification.json" --release-evidence "$RUNNER_TEMP/release-manifest.release-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-release-candidate-${{ steps.candidate.outputs.sha }}
          path: |
            ${{ runner.temp }}/package-one/
            ${{ runner.temp }}/package-two/
            ${{ runner.temp }}/oci/
            ${{ runner.temp }}/bundle/
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/release-qualification.json
            ${{ runner.temp }}/release-certification.json
            ${{ runner.temp }}/candidate-snapshot.json
          retention-days: 90
          if-no-files-found: error
