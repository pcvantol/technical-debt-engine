name: TDE merge qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: TDE merge qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install pinned CI pip
        run: python -m pip install --disable-pip-version-check --require-hashes --upgrade -r requirements/ci-bootstrap.txt
      - name: Install the candidate and analyzers
        run: |
          python -m pip wheel . --no-deps --wheel-dir candidate
          python -m pip install candidate/*.whl radon==6.0.1
      - name: Validate the canonical policy qualification unit suite
        run: |
          python -m unittest tests.test_policy -v
      - name: Qualify the current policy and dogfood path
        run: python tools/run_policy_qualification.py
      - name: Verify the proposed change has no whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
