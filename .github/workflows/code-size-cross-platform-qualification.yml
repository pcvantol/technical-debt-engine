name: Code Size cross-platform qualification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/test_code_size.py'
      - 'fixtures/code-size-cross-platform/**'
      - 'tools/*code_size*'
      - 'tools/*code-size*'
      - 'pyproject.toml'
      - '.github/workflows/code-size-cross-platform-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip wheel . --no-deps --wheel-dir candidate
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: code-size-candidate
          path: candidate/*.whl
          if-no-files-found: error

  qualify:
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-size-candidate
          path: candidate
      - name: Provision cloc 2.10 on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tde-cloc"
          curl --fail --location --silent --show-error https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl --output "$RUNNER_TEMP/tde-cloc/cloc"
          echo "bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  $RUNNER_TEMP/tde-cloc/cloc" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/tde-cloc/cloc"
          echo "$RUNNER_TEMP/tde-cloc" >> "$GITHUB_PATH"
      - name: Provision cloc 2.10 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'tde-cloc'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $executable = Join-Path $directory 'cloc.exe'
          Invoke-WebRequest -Uri 'https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.exe' -OutFile $executable
          if ((Get-FileHash -Algorithm SHA256 $executable).Hash -ne '97786C4B5BB71D2BE67E42061A2F5D03DB73BBF88228F8710001D770E867BBEF') { throw 'cloc checksum mismatch' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - shell: bash
        run: TDE_WHEEL="$(find candidate -name '*.whl' -print -quit)" TDE_CLOC_DIRECTORY="$RUNNER_TEMP/tde-cloc" python tools/run_code_size_qualification.py
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: code-size-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: qualification/
          if-no-files-found: error

  compare:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: code-size-qualification-*
          path: qualification-artifacts
          merge-multiple: true
      - run: mkdir -p qualification && cp qualification-artifacts/*.json qualification/ && python tools/compare_code_size_qualification.py
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: code-size-cross-platform-summary
          path: qualification/code-size-cross-platform-summary.json
