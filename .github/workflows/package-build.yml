name: Package build reproducibility

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'requirements/build-tools.txt'
      - 'src/**'
      - 'tests/test_build_reproducibility.py'
      - 'tools/package_build.py'
      - 'tools/verify_installed_package.py'
      - '.github/workflows/package-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned build and dogfood tools
        run: |
          python -m pip install --require-hashes -r requirements/build-tools.txt
          python -m pip install radon==6.0.1
          curl --fail --location --silent --show-error https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl --output /usr/local/bin/cloc
          echo 'bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  /usr/local/bin/cloc' | sha256sum --check
          chmod +x /usr/local/bin/cloc
      - name: Run deterministic build tests
        run: python -m unittest tests.test_build_reproducibility -v
      - name: Build two independent candidates
        run: |
          python tools/package_build.py --output artifacts/first
          python tools/package_build.py --output artifacts/second
          diff -u artifacts/first/SHA256SUMS artifacts/second/SHA256SUMS
          cmp artifacts/first/*.whl artifacts/second/*.whl
          cmp artifacts/first/*.tar.gz artifacts/second/*.tar.gz
      - name: Qualify installed wheel and source distribution
        run: python tools/verify_installed_package.py --wheel artifacts/first/*.whl --sdist artifacts/first/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build-evidence
          path: artifacts/first/
