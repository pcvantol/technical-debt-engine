name: Policy qualification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/test_policy.py'
      - 'tools/run_policy_qualification.py'
      - '.github/workflows/policy-qualification.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install candidate and analyzers
        run: |
          python -m pip wheel . --no-deps --wheel-dir candidate
          python -m pip install candidate/*.whl radon==6.0.1
          curl --fail --location --silent --show-error https://github.com/AlDanial/cloc/releases/download/v2.10/cloc-2.10.pl --output /usr/local/bin/cloc
          echo 'bf59272455172108072a0a106379f7509fd4349bdcfd85203bac038ccd286d83  /usr/local/bin/cloc' | sha256sum --check
          chmod +x /usr/local/bin/cloc
      - name: Validate policy qualification and dogfood
        run: |
          python -m unittest tests.test_policy -v
          python tools/run_policy_qualification.py
